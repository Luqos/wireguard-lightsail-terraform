name: Deploy

# Manual only. Plan runs without approval; apply and destroy wait for a
# reviewer on the "production" environment and then run the exact saved plan.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write # OIDC token for AWS
  contents: read

concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-5
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'ap-southeast-5' }}
  TF_STATE_KEY: wireguard-vpn/terraform.tfstate
  TF_WORKSPACE: my # state at env:/my/<key>; settings in envs/my.tfvars
  TF_IN_AUTOMATION: "true"
  # Private settings come from repository variables instead of terraform.tfvars.
  # Leaving them unset would delete the alarm and close SSH to your IP.
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_ssh_cidrs: ${{ vars.SSH_CIDRS || '[]' }}

jobs:
  plan:
    name: Plan (${{ inputs.action }})
    runs-on: ubuntu-latest
    steps:
      - name: Check repository variables
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$ROLE" ] || [ -z "$BUCKET" ]; then
            echo "::error::Set repository variables AWS_ROLE_ARN and TF_STATE_BUCKET first (see README, 'CD setup')."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.x" # S3 use_lockfile needs >= 1.10
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init (S3 backend)
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          cp ci/backend_s3.tf.txt backend_s3.tf
          terraform init -input=false \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION"

      - name: terraform plan
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -input=false -var-file=envs/my.tfvars -out=tfplan
          else
            terraform plan -input=false -var-file=envs/my.tfvars -out=tfplan
          fi
          {
            echo '## Terraform plan (${{ inputs.action }})'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: inputs.action != 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  execute:
    name: Run ${{ inputs.action }}
    needs: plan
    if: inputs.action != 'plan'
    runs-on: ubuntu-latest
    environment: production # required reviewer approves here
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.x"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init (S3 backend)
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          cp ci/backend_s3.tf.txt backend_s3.tf
          terraform init -input=false \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: terraform apply (saved plan)
        run: terraform apply -input=false tfplan

      - name: Outputs
        if: inputs.action == 'apply'
        run: terraform output
